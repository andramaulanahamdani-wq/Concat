id = "concat.df-title"
name = "Dark Fantasy Title"
language = "Latin"
order = 100

[style]
content = "THE FALLEN KINGDOM"
fontFamily = "Cinzel Decorative"
fontWeight = 700
fontSize = 0.085
color = "#d9b45a"
