id = "concat.noxara-title"
name = "Noxara Title"
language = "Latin"
order = 110

[style]
content = "NOXARA"
fontFamily = "Cinzel Decorative"
fontWeight = 700
fontSize = 0.12
color = "#c9a8ff"
