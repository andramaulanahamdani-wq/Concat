# Brightness only, painted green, inside the eyepiece. Pinned from the GPU
# (lavapipe) through the package's own shader.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.0325928, 0.428955, 0.060791, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.45, 0.4, 0.35, 1]
expect = [0.0314026, 0.400635, 0.0579224, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.08, 0.07, 0.06, 1]
expect = [0.0244904, 0.332031, 0.0461426, 1]
