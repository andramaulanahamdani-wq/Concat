format = 2

[effect]
id = "concat.night-vision"
name = "Night Vision"
kind = "filter"
category = "Documentary & Horror"
order = 57
intensity = "gain"
aliases = ["night-vision", "infrared", "ghost-hunt"]
description = "A night-vision scope's green phosphor: the dark pulled up hard, noise everywhere, and a round view that fades to black at its edge."

[[param]]
key = "gain"
label = "Gain"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
