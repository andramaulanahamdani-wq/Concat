format = 2

[effect]
id = "concat.letterbox"
name = "Letterbox"
kind = "effect"
category = "Documentary & Horror"
order = 60
aliases = ["letterbox", "cinema-bars", "black-bars"]
description = "Black bars that crop the frame to a cinema shape: 2.39 for the widescreen of a feature, 1.85 for a documentary's. A picture wider than the shape gets bars at the sides instead."

[[param]]
key = "aspect"
label = "Aspect"
min = 1.5
max = 3
default = 2.39
step = 0.01
unit = ":1"

[wgsl]
entry = "effect.wgsl"
